  <rect x="0" y="0" width="1400" height="1120" fill="#ffffff"/>
  <text x="700" y="45" class="title" text-anchor="middle">16-Site Silicon Probe To EDF Channel Mapping</text>
  <text x="700" y="73" class="subtitle" text-anchor="middle">Site order is bottom to top: site0 to site15. Blue-box order: 8, 1, 7, 2, 9, 16, 6, 3, 10, 17, 4, 15, 11, 14, 12, 13.</text>

